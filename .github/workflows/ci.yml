name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q taskbox notes_web pulseboard tests
      - name: Run unit and integration tests
        run: python -W error -m unittest discover -s tests -t .
      - name: PulseBoard migration smoke check
        run: python -m pulseboard --db /tmp/pulseboard-ci.db --seed --migrate-only
